[project]
name = "ppt2course"
version = "0.1.0"
description = "PPT2Course AI: convert PowerPoint slides into narrated course videos"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0",
    "edge-tts>=7.0",
    "python-docx>=1.1",
    "google-genai>=1.0",
    # Already pulled in transitively by google-genai (its HTTP transport) --
    # declared explicitly too because script_gen.py now imports it directly
    # to recognize transient connection failures (httpx.TransportError) for
    # retry, not just genai's own re-exported types.
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "jieba>=0.42",
    # Provides the `ffmpeg`/`ffprobe` executables via a pip-downloaded static
    # build instead of `apt-get install ffmpeg` -- see the Dockerfile comment
    # next to where this is pre-fetched for why.
    "static-ffmpeg>=2.5",
]

[project.optional-dependencies]
# Pillow itself isn't imported by application code (pptx_preview.py draws
# with PyMuPDF, not PIL) -- it's already pulled in transitively by
# python-pptx, but tests/test_pptx_preview.py imports it directly to build
# a sample embedded image, so it's declared explicitly here too.
dev = ["pytest>=8.0", "httpx>=0.27", "pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ppt2course = ["assets/avatar/default/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
