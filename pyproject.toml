[project]
name = "ppt2course"
version = "0.1.0"
description = "PPT2Course AI: convert PowerPoint slides into narrated course videos"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0",
    "edge-tts>=7.0",
    "python-docx>=1.1",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "jieba>=0.42",
    # Provides the `ffmpeg`/`ffprobe` executables via a pip-downloaded static
    # build instead of `apt-get install ffmpeg` -- see the Dockerfile comment
    # next to where this is pre-fetched for why.
    "static-ffmpeg>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ppt2course = ["assets/avatar/default/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
