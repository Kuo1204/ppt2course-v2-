[project]
name = "ppt2course"
version = "0.1.0"
description = "PPT2Course AI: convert PowerPoint slides into narrated course videos"
requires-python = ">=3.11"
dependencies = ["python-pptx>=1.0", "edge-tts>=7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
